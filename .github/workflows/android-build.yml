name: android-build

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simple-live-release.jks"
          test -s "$RUNNER_TEMP/simple-live-release.jks"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing (STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS)"
            exit 1
          fi
          cat > simple_live_app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/simple-live-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\).*/\1/p' simple_live_app/pubspec.yaml | head -1)"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::Cannot parse version from simple_live_app/pubspec.yaml"
            exit 1
          fi
          VERSION_NAME="${PUBSPEC_VERSION%%+*}"
          VERSION_CODE="${PUBSPEC_VERSION##*+}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              android-v[0-9]*)
                VERSION_NAME="${GITHUB_REF_NAME#android-v}"
                ;;
              *)
                echo "::error::Tag '$GITHUB_REF_NAME' does not match android-v<version>"
                exit 1
                ;;
            esac
          fi
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Cannot derive version name from '$GITHUB_REF_NAME' / pubspec version '$PUBSPEC_VERSION'"
            exit 1
          fi
          case "$VERSION_CODE" in
            "" | *[!0-9]*)
              echo "::error::Invalid build number '$VERSION_CODE' in simple_live_app/pubspec.yaml"
              exit 1
              ;;
          esac
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Preinstall Android NDK (retry-safe)
        run: |
          set -euo pipefail
          EXT="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          NDK_VERSION="$(grep -oE 'ndkVersion: String = "[0-9.]+"' "$EXT" | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::Cannot determine Flutter's default NDK version from $EXT"
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found under $SDK_ROOT; letting Gradle install the NDK"
            exit 0
          fi
          echo "Preinstalling Android NDK $NDK_VERSION"
          for attempt in 1 2 3 4; do
            if yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION" > /tmp/ndk-install.log 2>&1; then
              echo "NDK $NDK_VERSION installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed; cleaning partial download and retrying"
            tail -5 /tmp/ndk-install.log || true
            rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 5
          done
          echo "::error::Could not install Android NDK $NDK_VERSION after 4 attempts"
          exit 1

      - name: Build release APKs
        working-directory: simple_live_app
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name "$VERSION_NAME" \
            --build-number "$VERSION_CODE"

      - name: Collect APKs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/simple-live-${VERSION_NAME}-armeabi-v7a.apk"
          cp simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/simple-live-${VERSION_NAME}-arm64-v8a.apk"
          cp simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/simple-live-${VERSION_NAME}-x86_64.apk"
          ( cd dist && sha256sum simple-live-*.apk > SHA256SUMS.txt )
          ls -l dist

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v7
        with:
          name: simple-live-android-${{ steps.ver.outputs.name }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            simple_live_app/pubspec.lock
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Attach APKs to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --title "Android ${VERSION_NAME}" \
              --notes "Simple Live Android ${VERSION_NAME}（commit ${GITHUB_SHA::7}，构建于 $(date -u +%Y-%m-%dT%H:%M:%SZ)）"
          fi
