name: dep-scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Pub get
        working-directory: simple_live_app
        run: flutter pub get
      - name: Scan resolved Android plugin Gradle scripts
        run: |
          python3 - <<'PY'
          import glob, os, re
          cache = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          broken, ok = [], []
          for d in sorted(glob.glob(os.path.join(cache, '*', 'android'))):
              pkg = os.path.basename(os.path.dirname(d))
              scripts = [p for p in glob.glob(os.path.join(d, 'build.gradle*'))]
              if not scripts:
                  continue
              text = '\n'.join(open(p, encoding='utf-8', errors='replace').read() for p in scripts)
              applies = bool(re.search(r"kotlin-android|org\.jetbrains\.kotlin\.android|apply\(plugin = \"org\.jetbrains\.kotlin", text))
              kblock = bool(re.search(r'(?m)^\s*kotlin\s*\{', text))
              src = glob.glob(os.path.join(os.path.dirname(d), 'android', 'src', '**', '*.kt'), recursive=True)
              if kblock and not applies:
                  broken.append((pkg, 'BROKEN-config: kotlin{} without kotlin plugin'))
              elif src and not applies:
                  broken.append((pkg, 'BROKEN-registrant: .kt sources but kotlin plugin not applied'))
              else:
                  ok.append(pkg)
          print('android plugin packages:', len(ok) + len(broken))
          print('ok:', ', '.join(ok))
          for b in broken:
              print('BROKEN:', b[0], '->', b[1])
          PY
